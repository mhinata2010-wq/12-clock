<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="時刻だけを、美しく。シンプルなフルスクリーン時計。">
  <title>12 CLOCK</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #08090b; color: #f7f8fa; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { min-height: 100svh; min-height: 100dvh; overflow: hidden; }
    main { width: 100%; min-height: 100svh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    .clock { display: flex; align-items: baseline; justify-content: center; gap: clamp(8px, 1.8vw, 26px); width: 100%; white-space: nowrap; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    .time { font-size: clamp(2.6rem, 13.4vw, 13rem); font-weight: 550; letter-spacing: -0.075em; line-height: 1; }
    .period { color: #81858e; font-size: clamp(.85rem, 2.1vw, 2rem); font-weight: 500; letter-spacing: .09em; }
    @media (max-width: 560px) { .clock { gap: 10px; } .time { font-size: 15vw; } .period { font-size: 2.8vw; letter-spacing: .02em; } }
    @media (prefers-reduced-motion: no-preference) { .clock { animation: appear .65s ease-out both; } @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <main aria-label="現在の時刻">
    <div class="clock" role="timer" aria-live="off" aria-label="現在時刻">
      <span class="time" id="time">12:00:00</span>
      <span class="period" id="period">AM</span>
    </div>
  </main>
  <script>
    (() => {
      const timeElement = document.getElementById('time');
      const periodElement = document.getElementById('period');
      const pad = value => String(value).padStart(2, '0');
      let previousSecond = '';
      function render() {
        const now = new Date();
        const secondKey = [now.getHours(), now.getMinutes(), now.getSeconds()].join(':');
        if (secondKey === previousSecond) return;
        previousSecond = secondKey;
        const hour = now.getHours() % 12 || 12;
        timeElement.textContent = pad(hour) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        periodElement.textContent = now.getHours() < 12 ? 'AM' : 'PM';
        document.querySelector('.clock').setAttribute('aria-label', now.toLocaleTimeString('ja-JP'));
      }
      render();
      setInterval(render, 200);
      document.addEventListener('visibilitychange', render);
      window.addEventListener('focus', render);
    })();
  </script>
</body>
</html>
